<h1>Генератор слайдів для тексту пісні</h1>
<textarea id="lyrics" placeholder="Встав сюди текст пісні. Куплети розділяй порожнім рядком — кожен куплет стане окремим слайдом на весь екран."></textarea>
<button onclick="generate()">Генерувати</button>
<p class="hint">Порада: розділяй куплети порожнім рядком (Enter двічі). Текст між * або ** — жирний, між _ або __ — курсив. У режимі перегляду перемикай слайди стрілками або пробілом. A± — розмір шрифта, Shift +/− — лупа, T — тема.</p>
<a href="https://t.me/VerkhnieVysotske/7" target="_blank" rel="noopener noreferrer" class="mountain-link" title="Верхнє Висоцьке">⛰️</a>

<script>
function generate() {
  const text = document.getElementById('lyrics').value.trim();
  if (!text) {
    alert('Спочатку встав текст пісні.');
    return;
  }

  // Розбиваємо на куплети за порожніми рядками
  let stanzas = text.split(/\n\s*\n/).map(s => s.trim()).filter(s => s.length > 0);
  if (stanzas.length === 0) stanzas = [text];

  // Перший рядок тексту вважаємо назвою пісні
  const firstLine = text.split('\n')[0].trim();
  const songTitle = (firstLine.replace(/[*_]/g, '').trim() || 'Слайди пісні')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  const slidesHtml = stanzas.map((s, i) => {
    const escaped = s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/(\d+\s*)?куплет:?/gi, '<em>$&</em>')
      .replace(/червоний/gi, '<span style="color:#db2146">$&</span>')
      .replace(/синій/gi, '<span style="color:#219ddb">$&</span>')
      .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__([\s\S]+?)__/g, '<em>$1</em>')
      .replace(/\*([\s\S]+?)\*/g, '<strong>$1</strong>')
      .replace(/_([\s\S]+?)_/g, '<em>$1</em>');
    return `<section class="slide" ${i === 0 ? 'style="display:flex;"' : ''}>
      <div class="slide-text">${escaped.replace(/\n/g, '<br>')}</div>
    </section>`;
  }).join('\n');

  const presentationHtml = `<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>${songTitle}</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0d0d15;
    overflow: hidden;
    transition: background 0.2s ease;
  }
  body.light-theme {
    background: #ffffff;
  }
  .slide {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
  }
  .slide-text {
    color: #f2f2f2;
    font-family: 'Akrobat Black', 'Segoe UI', Arial, sans-serif;
    font-size: clamp(28px, 5vw, 64px);
    line-height: 1.4;
    text-align: center;
    max-width: 85%;
    white-space: pre-wrap;
    transform: scale(1);
    transform-origin: center center;
    transition: transform 0.15s ease-out, color 0.2s ease;
  }
  body.light-theme .slide-text {
    color: #111111;
  }
  .counter {
    position: fixed;
    bottom: 20px;
    right: 30px;
    color: #666;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }
  body.light-theme .counter {
    color: #999;
  }
  .nav-hint {
    position: fixed;
    bottom: 20px;
    left: 30px;
    color: #555;
    font-family: Arial, sans-serif;
    font-size: 13px;
  }
  body.light-theme .nav-hint {
    color: #aaa;
  }
  .adjacent-preview {
    position: fixed;
    bottom: 45px;
    right: 30px;
    color: #555;
    font-family: Arial, sans-serif;
    font-size: 13px;
    text-align: right;
    line-height: 1.5;
  }
  body.light-theme .adjacent-preview {
    color: #aaa;
  }
  @media (max-width: 768px) {
    .nav-hint,
    .adjacent-preview {
      display: none;
    }
  }
  .font-controls {
    position: fixed;
    top: 20px;
    right: 30px;
    display: flex;
    gap: 8px;
  }
  .font-controls button {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2a2a3d;
    color: #eee;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }
  .font-controls button:hover {
    background: #3a3a52;
  }
  body.light-theme .font-controls button {
    border: 1px solid #ccc;
    background: #f0f0f0;
    color: #222;
  }
  body.light-theme .font-controls button:hover {
    background: #e0e0e0;
  }
  #themeBtn {
    border: none !important;
    background: none !important;
  }
  #themeBtn:hover {
    background: rgba(128,128,128,0.15) !important;
  }
</style>
</head>
<body>

${slidesHtml}

<div class="counter" id="counter">1 / ${stanzas.length}</div>
<div class="adjacent-preview" id="adjacentPreview">
  <div id="prevPreview"></div>
  <div id="nextPreview"></div>
</div>
<div class="nav-hint">↑↓ / ←→ / пробіл / колесико / свайп — гортати · Esc — закрити · A± розмір шрифта · Shift +/− лупа · T — тема · F — шрифт · B — ВЕЛИКІ ЛІТЕРИ · W — повний екран</div>
<div class="font-controls">
  <button onclick="event.stopPropagation(); changeFontSize(-4)" title="Зменшити шрифт">A−</button>
  <button onclick="event.stopPropagation(); changeFontSize(4)" title="Збільшити шрифт">A+</button>
  <button onclick="event.stopPropagation(); changeZoom(-0.2)" title="Віддалити (Shift −)">🔍−</button>
  <button onclick="event.stopPropagation(); changeZoom(0.2)" title="Наблизити (Shift +)">🔍+</button>
  <button onclick="event.stopPropagation(); toggleTheme()" title="Змінити тему (T)" id="themeBtn">🌙</button>
  <button onclick="event.stopPropagation(); cycleFont()" title="Наступний шрифт (F)" id="fontBtn">Aa</button>
  <button onclick="event.stopPropagation(); toggleUppercase()" title="Верхній регістр (B)" id="caseBtn">AB</button>
  <button onclick="event.stopPropagation(); toggleFullscreen()" title="Повний екран (W)" id="fullscreenBtn">⛶</button>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const counter = document.getElementById('counter');
  const texts = document.querySelectorAll('.slide-text');
  let current = 0;
  let fontSize = null;
  let zoomLevel = 1;

  function initFontSize() {
    const computed = window.getComputedStyle(texts[0]).fontSize;
    fontSize = parseFloat(computed);
  }

  function changeFontSize(delta) {
    if (fontSize === null) initFontSize();
    fontSize = Math.max(12, Math.min(160, fontSize + delta));
    texts.forEach(t => t.style.fontSize = fontSize + 'px');
  }

  function changeZoom(delta) {
    zoomLevel = Math.max(0.5, Math.min(5, zoomLevel + delta));
    texts.forEach(t => t.style.transform = 'scale(' + zoomLevel.toFixed(2) + ')');
  }

  function toggleTheme() {
    document.body.classList.toggle('light-theme');
    const isLight = document.body.classList.contains('light-theme');
    document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  }

  // --- Перемикання шрифтів (клавіша F) ---
  const fontList = ['Akrobat Black', 'Segoe UI', 'Arial', 'Roboto', 'Tahoma', 'Times New Roman', 'Comic Sans MS'];
  let fontIndex = 0;

  function isFontAvailable(font) {
    if (font.toLowerCase() === 'sans-serif') return true; // родова назва — завжди "доступна"
    const testString = 'mmmmmmmmmmlli';
    const testSize = '72px';
    const baseFonts = ['monospace', 'sans-serif', 'serif'];
    const span = document.createElement('span');
    span.style.position = 'absolute';
    span.style.left = '-9999px';
    span.style.fontSize = testSize;
    span.textContent = testString;
    document.body.appendChild(span);

    const defaultWidths = {};
    baseFonts.forEach(bf => {
      span.style.fontFamily = bf;
      defaultWidths[bf] = span.offsetWidth;
    });

    let detected = false;
    for (const bf of baseFonts) {
      span.style.fontFamily = "'" + font + "', " + bf;
      if (span.offsetWidth !== defaultWidths[bf]) {
        detected = true;
        break;
      }
    }
    document.body.removeChild(span);
    return detected;
  }

  function applyFont(font) {
    texts.forEach(t => t.style.fontFamily = "'" + font + "', sans-serif");
  }

  function cycleFont() {
    let attempts = 0;
    let candidate;
    do {
      fontIndex = (fontIndex + 1) % fontList.length;
      candidate = fontList[fontIndex];
      attempts++;
    } while (!isFontAvailable(candidate) && attempts < fontList.length);
    applyFont(candidate);
  }

  // --- Перемикання верхнього регістру (клавіша B) ---
  let isUppercase = false;
  function toggleUppercase() {
    isUppercase = !isUppercase;
    texts.forEach(t => t.style.textTransform = isUppercase ? 'uppercase' : 'none');
  }

  // --- Повноекранний режим ---
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fullscreenBtn');
    if (btn) btn.textContent = document.fullscreenElement ? '⤢' : '⛶';
  });

  function getFirstWords(idx) {
    if (idx < 0 || idx >= slides.length) return '';
    const el = slides[idx].querySelector('.slide-text');
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    if (!text) return '';
    const words = text.split(' ').slice(0, 4).join(' ');
    return words;
  }

  function updateAdjacentPreview(i) {
    const prevWords = getFirstWords(i - 1);
    const nextWords = getFirstWords(i + 1);
    document.getElementById('prevPreview').textContent = prevWords ? ('← ' + prevWords + '…') : '';
    document.getElementById('nextPreview').textContent = nextWords ? (nextWords + '… →') : '';
  }

  function showSlide(i) {
    if (i < 0 || i >= slides.length) return;
    slides[current].style.display = 'none';
    current = i;
    slides[current].style.display = 'flex';
    counter.textContent = (current + 1) + ' / ' + slides.length;
    updateAdjacentPreview(current);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'ArrowDown') {
      e.preventDefault();
      showSlide(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      showSlide(current - 1);
    } else if (e.key === 'Escape') {
      window.close();
    } else if (e.code === 'Equal' || e.code === 'NumpadAdd') {
      // Фізична клавіша "+": без Shift — розмір шрифта, з Shift — лупа
      e.preventDefault();
      if (e.shiftKey) {
        changeZoom(0.2);
      } else {
        changeFontSize(4);
      }
    } else if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
      // Фізична клавіша "-": без Shift — розмір шрифта, з Shift — лупа
      e.preventDefault();
      if (e.shiftKey) {
        changeZoom(-0.2);
      } else {
        changeFontSize(-4);
      }
    } else if (e.code === 'KeyT') {
      toggleTheme();
    } else if (e.code === 'KeyF') {
      cycleFont();
    } else if (e.code === 'KeyB') {
      toggleUppercase();
    } else if (e.code === 'KeyW') {
      toggleFullscreen();
    }
  });

  document.documentElement.requestFullscreen?.().catch(() => {});
  updateAdjacentPreview(current);

  let wheelLock = false;
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelLock) return;
    if (Math.abs(e.deltaY) < 10) return;
    wheelLock = true;
    if (e.deltaY > 0) {
      showSlide(current + 1);
    } else {
      showSlide(current - 1);
    }
    setTimeout(() => { wheelLock = false; }, 400);
  }, { passive: false });

  // --- Свайпи на мобільних пристроях ---
  let touchStartY = null;
  document.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    if (touchStartY === null) return;
    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchEndY - touchStartY;
    const threshold = 50;
    if (diff > threshold) {
      // палець рухається вниз (свайп вниз) = наступний слайд
      showSlide(current + 1);
    } else if (diff < -threshold) {
      // палець рухається вгору (свайп вгору) = попередній слайд
      showSlide(current - 1);
    }
    touchStartY = null;
  }, { passive: true });
<\/script>
</body>
</html>`;

  const win = window.open('', '_blank');
  if (!win) {
    alert('Браузер заблокував відкриття нової вкладки. Дозволь спливаючі вікна для цієї сторінки.');
    return;
  }
  win.document.open();
  win.document.write(presentationHtml);
  win.document.close();
}

  const cloudHtml = '<!DOCTYPE html>\n' +

'<meta charset="UTF-8">\n' +

'#cloudFontControls button:hover{background:rgba(0,0,0,.14);transform:scale(1.05)}\n' +

'.cloud-song.hide{animation:cloudSongDisappear .65s cubic-bezier(.4,0,.2,1) forwards !important}\n' +

'@media (max-width:600px){.cloud-song{font-size:17px;max-width:200px}}\n' +
'</style>\n' +
'</head>\n' +
'<body>\n' +
'<div id="cloudFontControls" aria-label="Розмір шрифту">\n' +
'<button id="cloudFontDecrease" aria-label="Зменшити шрифт">−</button>\n' +
'<button id="cloudFontIncrease" aria-label="Збільшити шрифт">+</button>\n' +
'</div>\n' +
'<button id="cloudThemeToggle" aria-label="Інвертувати кольори">T</button>\n' +
'<button id="cloudCloseBtn" aria-label="Закрити">×</button>\n' +
'<div id="cloudSongsCloud"></div>\n' +
'<div id="cloudSongList"><ol id="cloudSongListOl"></ol></div>\n' +
'<script>\n' +
'const cloudUniqueSongs = ' + songsJson + ';\n' +
'const cloudWindowEl = document.body;\n' +
'const cloudSongsCloudEl = document.getElementById("cloudSongsCloud");\n' +
'const cloudFontDecrease = document.getElementById("cloudFontDecrease");\n' +
'const cloudFontIncrease = document.getElementById("cloudFontIncrease");\n' +
'const cloudThemeToggleBtn = document.getElementById("cloudThemeToggle");\n' +
'const cloudCloseBtn = document.getElementById("cloudCloseBtn");\n' +
'const cloudSongListEl = document.getElementById("cloudSongList");\n' +
'const cloudSongListOl = document.getElementById("cloudSongListOl");\n' +
'let cloudListMode = false;\n' +
'const cloudFontList = ["Akrobat Black","Segoe UI","Arial","Roboto","Tahoma","Times New Roman","Comic Sans MS"];\n' +
'let cloudFontIndex = 0;\n' +
'let cloudFontFamily = cloudFontList[0];\n' +
'function cloudIsFontAvailable(font){\n' +
'  if (font.toLowerCase() === "sans-serif") return true;\n' +
'  const testString = "mmmmmmmmmmlli";\n' +
'  const testSize = "72px";\n' +
'  const baseFonts = ["monospace","sans-serif","serif"];\n' +
'  const span = document.createElement("span");\n' +
'  span.style.position = "absolute";\n' +
'  span.style.left = "-9999px";\n' +
'  span.style.fontSize = testSize;\n' +
'  span.textContent = testString;\n' +
'  document.body.appendChild(span);\n' +
'  const defaultWidths = {};\n' +
'  baseFonts.forEach(function(bf){\n' +
'    span.style.fontFamily = bf;\n' +
'    defaultWidths[bf] = span.offsetWidth;\n' +
'  });\n' +
'  let detected = false;\n' +
'  for (let i = 0; i < baseFonts.length; i++) {\n' +
'    const bf = baseFonts[i];\n' +
'    span.style.fontFamily = "\'" + font + "\', " + bf;\n' +
'    if (span.offsetWidth !== defaultWidths[bf]) { detected = true; break; }\n' +
'  }\n' +
'  document.body.removeChild(span);\n' +
'  return detected;\n' +
'}\n' +
'function cloudApplyFontFamily(font){\n' +
'  cloudFontFamily = font;\n' +
'  const familyStr = "\'" + font + "\', sans-serif";\n' +
'  for (const item of cloudActiveSongs) {\n' +
'    item.element.style.fontFamily = familyStr;\n' +
'  }\n' +
'  const liEls = cloudSongListOl.querySelectorAll("li");\n' +
'  liEls.forEach(function(li){ li.style.fontFamily = familyStr; });\n' +
'}\n' +
'function cloudCycleFont(){\n' +
'  let attempts = 0;\n' +
'  let candidate;\n' +
'  do {\n' +
'    cloudFontIndex = (cloudFontIndex + 1) % cloudFontList.length;\n' +
'    candidate = cloudFontList[cloudFontIndex];\n' +
'    attempts++;\n' +
'  } while (!cloudIsFontAvailable(candidate) && attempts < cloudFontList.length);\n' +
'  cloudApplyFontFamily(candidate);\n' +
'}\n' +
'function cloudEscapeHtml(str){\n' +
'  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");\n' +
'}\n' +
'function cloudBuildSongList(){\n' +
'  const sorted = cloudUniqueSongs.slice().sort(function(a, b){\n' +
'    return a.localeCompare(b, "uk");\n' +
'  });\n' +
'  cloudSongListOl.innerHTML = sorted.map(function(song){\n' +
'    return "<li>" + cloudEscapeHtml(song) + "</li>";\n' +
'  }).join("");\n' +
'  const familyStr = "\'" + cloudFontFamily + "\', sans-serif";\n' +
'  cloudSongListOl.querySelectorAll("li").forEach(function(li){ li.style.fontFamily = familyStr; });\n' +
'}\n' +
'function cloudToggleList(){\n' +
'  cloudListMode = !cloudListMode;\n' +
'  if (cloudListMode) {\n' +
'    if (cloudTimer !== null) { clearInterval(cloudTimer); cloudTimer = null; }\n' +
'    cloudSongsCloudEl.innerHTML = "";\n' +
'    cloudActiveSongs = [];\n' +
'    cloudSongsCloudEl.style.display = "none";\n' +
'    cloudSongListEl.classList.add("visible");\n' +
'  } else {\n' +
'    cloudSongListEl.classList.remove("visible");\n' +
'    cloudSongsCloudEl.style.display = "";\n' +
'    cloudCreateNewSongCycle();\n' +
'    cloudCreateSong();\n' +
'    cloudTimer = setInterval(cloudCreateSong, 2000);\n' +
'  }\n' +
'}\n' +
'let cloudFontScale = 1;\n' +
'const CLOUD_FONT_STEP = 0.10;\n' +
'const CLOUD_MIN_FONT_SCALE = 0.40;\n' +
'const CLOUD_MAX_FONT_SCALE = 12;\n' +
'let cloudTimer = null;\n' +
'let cloudActiveSongs = [];\n' +
'let cloudShuffledSongs = [];\n' +
'let cloudCurrentSongIndex = 0;\n' +
'let cloudLastSongOfPreviousCycle = null;\n' +
'function cloudGetBaseFontSize(){\n' +
'  const area = window.innerWidth * window.innerHeight;\n' +
'  if (area >= 7000000) return 38;\n' +
'  if (area >= 3000000) return 32;\n' +
'  if (area >= 1800000) return 26;\n' +
'  if (area >= 900000) return 21;\n' +
'  return 18;\n' +
'}\n' +
'function cloudGetCurrentFontSize(){\n' +
'  return Math.max(10, cloudGetBaseFontSize() * cloudFontScale);\n' +
'}\n' +
'function cloudApplyFontSizeToSongs(){\n' +
'  const size = cloudGetCurrentFontSize();\n' +
'  for (const item of cloudActiveSongs) {\n' +
'    item.element.style.setProperty("--song-font-size", size + "px");\n' +
'  }\n' +
'}\n' +
'function cloudRebuildSongPositions(){\n' +
'  cloudApplyFontSizeToSongs();\n' +
'  while (cloudActiveSongs.length > 0) {\n' +
'    const placed = [];\n' +
'    let failed = false;\n' +
'    for (const item of cloudActiveSongs) {\n' +
'      const width = item.element.offsetWidth;\n' +
'      const height = item.element.offsetHeight;\n' +
'      const position = cloudFindFreePositionForList(width, height, placed);\n' +
'      if (!position) { failed = true; break; }\n' +
'      item.element.style.left = position.x + "px";\n' +
'      item.element.style.top = position.y + "px";\n' +
'      item.x = position.x;\n' +
'      item.y = position.y;\n' +
'      item.width = width;\n' +
'      item.height = height;\n' +
'      placed.push({ x: position.x, y: position.y, width, height });\n' +
'    }\n' +
'    if (!failed) return;\n' +
'    cloudRemoveOldestSong(true);\n' +
'  }\n' +
'}\n' +
'function cloudFindFreePositionForList(width, height, placed){\n' +
'  const screenWidth = window.innerWidth;\n' +
'  const screenHeight = window.innerHeight;\n' +
'  const padding = Math.max(35, Math.min(screenWidth, screenHeight) * 0.025);\n' +
'  const gap = Math.max(25, Math.min(screenWidth, screenHeight) * 0.018);\n' +
'  for (let i = 0; i < 500; i++) {\n' +
'    const x = padding + Math.random() * Math.max(1, screenWidth - width - padding * 2);\n' +
'    const y = padding + Math.random() * Math.max(1, screenHeight - height - padding * 2);\n' +
'    const candidate = { x, y, width, height };\n' +
'    let free = true;\n' +
'    for (const item of placed) {\n' +
'      const overlap = candidate.x < item.x + item.width + gap && candidate.x + candidate.width + gap > item.x && candidate.y < item.y + item.height + gap && candidate.y + candidate.height + gap > item.y;\n' +
'      if (overlap) { free = false; break; }\n' +
'    }\n' +
'    if (free) return candidate;\n' +
'  }\n' +
'  return null;\n' +
'}\n' +
'function cloudChangeFontSize(delta){\n' +
'  const next = Math.min(CLOUD_MAX_FONT_SCALE, Math.max(CLOUD_MIN_FONT_SCALE, cloudFontScale + delta));\n' +
'  if (next === cloudFontScale) return;\n' +
'  cloudFontScale = next;\n' +
'  cloudRebuildSongPositions();\n' +
'}\n' +
'function cloudGetTargetSongCount(){\n' +
'  const area = window.innerWidth * window.innerHeight;\n' +
'  if (area >= 7000000) return 32;\n' +
'  if (area >= 3000000) return 27;\n' +
'  if (area >= 1800000) return 22;\n' +
'  if (area >= 900000) return 16;\n' +
'  return 10;\n' +
'}\n' +
'function cloudShuffleSongs(array){\n' +
'  const result = array.slice();\n' +
'  for (let i = result.length - 1; i > 0; i--) {\n' +
'    const randomIndex = Math.floor(Math.random() * (i + 1));\n' +
'    [result[i], result[randomIndex]] = [result[randomIndex], result[i]];\n' +
'  }\n' +
'  return result;\n' +
'}\n' +
'function cloudCreateNewSongCycle(){\n' +
'  cloudShuffledSongs = cloudShuffleSongs(cloudUniqueSongs);\n' +
'  if (cloudShuffledSongs.length > 1 && cloudLastSongOfPreviousCycle !== null && cloudShuffledSongs[0] === cloudLastSongOfPreviousCycle) {\n' +
'    const randomIndex = 1 + Math.floor(Math.random() * (cloudShuffledSongs.length - 1));\n' +
'    [cloudShuffledSongs[0], cloudShuffledSongs[randomIndex]] = [cloudShuffledSongs[randomIndex], cloudShuffledSongs[0]];\n' +
'  }\n' +
'  cloudCurrentSongIndex = 0;\n' +
'}\n' +
'function cloudGetNextSong(){\n' +
'  if (cloudShuffledSongs.length === 0 || cloudCurrentSongIndex >= cloudShuffledSongs.length) {\n' +
'    if (cloudShuffledSongs.length > 0) {\n' +
'      cloudLastSongOfPreviousCycle = cloudShuffledSongs[cloudShuffledSongs.length - 1];\n' +
'    }\n' +
'    cloudCreateNewSongCycle();\n' +
'  }\n' +
'  return cloudShuffledSongs[cloudCurrentSongIndex++];\n' +
'}\n' +
'function cloudToggleTheme(){\n' +
'  cloudWindowEl.classList.toggle("dark");\n' +
'}\n' +
'function cloudCreateSong(){\n' +
'  const targetCount = cloudGetTargetSongCount();\n' +
'  if (cloudActiveSongs.length >= targetCount) {\n' +
'    cloudRemoveOldestSong(false);\n' +
'  }\n' +
'  const song = cloudGetNextSong();\n' +
'  if (!song) return;\n' +
'  const element = document.createElement("div");\n' +
'  const directions = [["0px","-18px"],["0px","18px"],["-18px","0px"],["18px","0px"],["-12px","-12px"],["12px","-12px"],["-12px","12px"],["12px","12px"]];\n' +
'  const direction = directions[Math.floor(Math.random() * directions.length)];\n' +
'  element.style.setProperty("--enter-x", direction[0]);\n' +
'  element.style.setProperty("--enter-y", direction[1]);\n' +
'  element.className = "cloud-song";\n' +
'  element.textContent = song;\n' +
'  element.style.fontFamily = "\'" + cloudFontFamily + "\', sans-serif";\n' +
'  element.style.setProperty("--song-font-size", cloudGetCurrentFontSize() + "px");\n' +
'  element.style.visibility = "hidden";\n' +
'  cloudSongsCloudEl.appendChild(element);\n' +
'  const width = element.offsetWidth;\n' +
'  const height = element.offsetHeight;\n' +
'  let position = cloudFindFreePosition(width, height);\n' +
'  while (!position && cloudActiveSongs.length > 0) {\n' +
'    cloudRemoveOldestSong(false);\n' +
'    position = cloudFindFreePosition(width, height);\n' +
'  }\n' +
'  if (!position) { element.remove(); return; }\n' +
'  element.style.left = position.x + "px";\n' +
'  element.style.top = position.y + "px";\n' +
'  element.style.visibility = "visible";\n' +
'  cloudActiveSongs.push({ element, x: position.x, y: position.y, width, height });\n' +
'}\n' +
'function cloudFindFreePosition(width, height){\n' +
'  const screenWidth = window.innerWidth;\n' +
'  const screenHeight = window.innerHeight;\n' +
'  const padding = Math.max(35, Math.min(screenWidth, screenHeight) * 0.025);\n' +
'  const gap = Math.max(25, Math.min(screenWidth, screenHeight) * 0.018);\n' +
'  const attempts = 400;\n' +
'  for (let i = 0; i < attempts; i++) {\n' +
'    const x = padding + Math.random() * Math.max(1, screenWidth - width - padding * 2);\n' +
'    const y = padding + Math.random() * Math.max(1, screenHeight - height - padding * 2);\n' +
'    const candidate = { x, y, width, height };\n' +
'    if (cloudIsPositionFree(candidate, gap)) return candidate;\n' +
'  }\n' +
'  return null;\n' +
'}\n' +
'function cloudIsPositionFree(candidate, gap){\n' +
'  for (const item of cloudActiveSongs) {\n' +
'    const overlap = candidate.x < item.x + item.width + gap && candidate.x + candidate.width + gap > item.x && candidate.y < item.y + item.height + gap && candidate.y + candidate.height + gap > item.y;\n' +
'    if (overlap) return false;\n' +
'  }\n' +
'  return true;\n' +
'}\n' +
'function cloudRemoveOldestSong(immediate){\n' +
'  if (cloudActiveSongs.length === 0) return;\n' +
'  const oldSong = cloudActiveSongs.shift();\n' +
'  if (!oldSong.element) return;\n' +
'  if (immediate) { oldSong.element.remove(); return; }\n' +
'  oldSong.element.classList.add("hide");\n' +
'  setTimeout(function(){\n' +
'    if (oldSong.element && oldSong.element.parentNode) {\n' +
'      oldSong.element.remove();\n' +
'    }\n' +
'  }, 700);\n' +
'}\n' +
'cloudCloseBtn.addEventListener("click", function(){ window.close(); });\n' +
'document.addEventListener("keydown", function(event){\n' +
'  if (event.key === "Escape") { window.close(); }\n' +
'  if (event.key === "+" || event.key === "=" || event.code === "NumpadAdd") {\n' +
'    event.preventDefault();\n' +
'    cloudChangeFontSize(CLOUD_FONT_STEP);\n' +
'  }\n' +
'  if (event.key === "-" || event.key === "_" || event.code === "NumpadSubtract") {\n' +
'    event.preventDefault();\n' +
'    cloudChangeFontSize(-CLOUD_FONT_STEP);\n' +
'  }\n' +
'  if (event.key === "t" || event.key === "T" || event.code === "KeyT") {\n' +
'    event.preventDefault();\n' +
'    cloudToggleTheme();\n' +
'  }\n' +
'  if (event.code === "KeyL") {\n' +
'    event.preventDefault();\n' +
'    cloudToggleList();\n' +
'  }\n' +
'  if (event.code === "KeyF") {\n' +
'    event.preventDefault();\n' +
'    cloudCycleFont();\n' +
'  }\n' +
'});\n' +
'cloudFontIncrease.addEventListener("click", function(){ cloudChangeFontSize(CLOUD_FONT_STEP); });\n' +
'cloudFontDecrease.addEventListener("click", function(){ cloudChangeFontSize(-CLOUD_FONT_STEP); });\n' +
'cloudThemeToggleBtn.addEventListener("click", function(){ cloudToggleTheme(); });\n' +
'window.addEventListener("resize", function(){\n' +
'  const target = cloudGetTargetSongCount();\n' +
'  while (cloudActiveSongs.length > target) {\n' +
'    cloudRemoveOldestSong();\n' +
'  }\n' +
'  cloudRebuildSongPositions();\n' +
'});\n' +
'cloudBuildSongList();\n' +
'cloudCreateNewSongCycle();\n' +
'cloudCreateSong();\n' +
'cloudTimer = setInterval(cloudCreateSong, 2000);\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';

  const cloudWin = window.open('', '_blank');
  if (!cloudWin) {
    alert('Браузер заблокував відкриття нової вкладки. Дозволь спливаючі вікна для цієї сторінки.');
    return;
  }
  cloudWin.document.open();
  cloudWin.document.write(cloudHtml);
  cloudWin.document.close();
}

document.getElementById('cloudOpenBtn').addEventListener('click', openSongCloud);
